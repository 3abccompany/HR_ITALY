name: G1A Storage Rules Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "storage.rules"
      - "firestore.rules"
      - "firebase.json"
      - "tests/security/storage-rules.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/g1a-storage-rules.yml"

jobs:
  storage-rules:
    name: Firebase Storage Rules authorization tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Diff check
        run: git diff --check

      - name: Run Storage Rules emulator tests
        run: npm run test:storage-rules:emulator
